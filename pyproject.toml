[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "clothdojo"
version = "0.1.0"
description = "Reproducible cloth-manipulation data agents and benchmarks."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4", "scipy==1.17.1", "PyYAML==6.0.3",
    "opencv-python-headless==4.11.0.86",
]

[project.scripts]
clothdojo = "clothdojo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clothdojo.collection" = ["static/*.html", "static/*.js", "static/*.css"]
"clothdojo.data" = ["isaac_export.kit", "*.mdl"]
"clothdojo.evaluation" = ["fold_quality_weights.json"]
"clothdojo.teleop" = ["teleop.kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
