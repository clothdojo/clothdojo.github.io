name: Website visual review

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit to review
        required: true
        default: main
        type: string
      page_path:
        description: Website page path to capture
        required: false
        default: index.html
        type: string
  push:
    branches: [main]
    paths:
      - 'docs/usage.md'
      - '.github/workflows/website-visual-review.yml'
      - '.github/scripts/website-visual-review.cjs'
      - 'website/**/*.html'
      - 'website/**/*.css'
      - 'website/**/*.js'
      - 'website/assets/launch/*.mp4'
      - 'website/assets/launch/*-poster.jpg'
      - 'website/assets/launch/manifest.json'
      - 'website/assets/studio/**'
      - 'website/assets/studio26/**'
      - 'website/assets/studio27/**'
      - 'website/assets/studio28/**'
      - 'website/assets/studio29/**'
      - 'website/assets/rgb30/**'
      - 'website/assets/studio31/**'
      - 'website/assets/studio33/**'
      - 'website/assets/studio35/**'
      - 'website/assets/studio37/**'
      - 'website/assets/studio40/**'
      - 'website/assets/studio44/**'
      - 'website/assets/camera45/**'
      - 'website/assets/live46/**'
      - 'website/vendor/**'
      - '.github/scripts/camera-live-review.cjs'
      - '.github/scripts/cloth-study-review.cjs'
      - '.github/scripts/lighting-study-review.cjs'
      - '.github/scripts/distance-study-review.cjs'
      - '.github/scripts/distance-stream-review.cjs'
      - '.github/scripts/generation-film-review.cjs'
      - '.github/scripts/homepage-film-review.cjs'
      - '.github/scripts/gallery-playback-review.cjs'
      - 'website/assets/camera52/**'
      - 'website/assets/camera58/**'
      - 'website/assets/camera60/**'
      - 'website/assets/film61/**'
      - 'website/assets/film62/**'
      - 'website/assets/hero87/**'
      - 'website/assets/robots71/**'
      - 'website/assets/atlas73/**'
      - 'website/assets/transfer73/**'
      - 'website/assets/rgb76/**'
      - 'website/assets/rgb77/**'
      - 'website/assets/cards78/**'
      - 'website/assets/robots79/**'
      - 'website/assets/robots80/**'
      - 'website/assets/robots81/**'
      - 'website/assets/robots82/**'
      - 'website/assets/robots85/**'
      - 'website/assets/gallery86/**'
      - 'website/assets/cloth48/**'
      - 'website/assets/atlas32/**'

permissions:
  contents: write

concurrency:
  group: website-visual-review
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install pinned browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" playwright@1.56.1 http-server@14.1.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          google-chrome --version
      - name: Render and exercise the current website
        timeout-minutes: 8
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tools/node_modules
          REVIEW_OUTPUT: ${{ runner.temp }}/visual-review
          REVIEW_REF: ${{ inputs.ref || github.sha }}
          REVIEW_PAGE_PATH: ${{ inputs.page_path || 'index.html' }}
        run: |
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/http-server" website -a 127.0.0.1 -p 8787 -c-1 -s > "$RUNNER_TEMP/site-server.log" 2>&1 &
          if [ '${{ inputs.page_path }}' = 'distance-study.html' ]; then
            node .github/scripts/generation-film-review.cjs
          elif [ '${{ inputs.page_path }}' = '' ] || [ '${{ inputs.page_path }}' = 'index.html' ] || [ '${{ inputs.page_path }}' = 'research-preview-v31.html' ]; then
            node .github/scripts/homepage-film-review.cjs
          else
            node .github/scripts/website-visual-review.cjs
          fi
      - name: Save review images on the dedicated evidence branch
        if: always()
        env:
          REVIEW_OUTPUT: ${{ runner.temp }}/visual-review
        run: |
          test -f "$REVIEW_OUTPUT/report.json"
          git config user.name 'ClothDojo visual review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin site-review > /dev/null; then
            git fetch origin site-review
            git checkout -B site-review FETCH_HEAD
          else
            git checkout --orphan site-review
            git rm -rf -- .
          fi
          git ls-files -z -- '*.png' '*.jpg' '*.jpeg' '*.webm' report.json | xargs -0 -r git rm --
          cp "$REVIEW_OUTPUT/report.json" .
          find "$REVIEW_OUTPUT" -maxdepth 1 -type f -name '*.jpg' -exec cp '{}' . \;
          find "$REVIEW_OUTPUT" -maxdepth 1 -type f -name '*.webm' -exec cp '{}' . \;
          git add -A -- .
          git commit -m 'Capture rendered website and interaction evidence' || test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/site-review
