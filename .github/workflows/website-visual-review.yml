name: Website visual review

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit to review
        required: true
        default: main
        type: string
      page_path:
        description: Website page path to capture
        required: false
        default: index.html
        type: string
  push:
    branches: [main, codex/launch-rebuild, codex/title-details, codex/scale-reveal, codex/scale-hundreds, codex/studio-rebuild]
    paths:
      - '.github/workflows/website-visual-review.yml'
      - '.github/scripts/website-visual-review.cjs'
      - 'website/**/*.html'
      - 'website/**/*.css'
      - 'website/**/*.js'
      - 'website/assets/launch/*.mp4'
      - 'website/assets/launch/*-poster.jpg'
      - 'website/assets/launch/manifest.json'
      - 'website/assets/studio/**'

permissions:
  contents: write

concurrency:
  group: website-visual-review
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install pinned browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" playwright@1.56.1 http-server@14.1.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          google-chrome --version
      - name: Render and exercise the current website
        timeout-minutes: 8
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tools/node_modules
          REVIEW_OUTPUT: ${{ runner.temp }}/visual-review
          REVIEW_REF: ${{ inputs.ref || github.sha }}
          REVIEW_PAGE_PATH: ${{ inputs.page_path || 'index.html' }}
        run: |
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/http-server" website -a 127.0.0.1 -p 8787 -c-1 -s > "$RUNNER_TEMP/site-server.log" 2>&1 &
          node .github/scripts/website-visual-review.cjs
      - name: Save review images on the dedicated evidence branch
        if: always()
        env:
          REVIEW_OUTPUT: ${{ runner.temp }}/visual-review
        run: |
          test -f "$REVIEW_OUTPUT/report.json"
          git config user.name 'ClothDojo visual review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin codex/site-visual-review > /dev/null; then
            git fetch origin codex/site-visual-review
            git checkout -B codex/site-visual-review FETCH_HEAD
          else
            git checkout --orphan codex/site-visual-review
            git rm -rf -- .
          fi
          git ls-files -z -- '*.png' '*.jpg' '*.jpeg' report.json | xargs -0 -r git rm --
          cp "$REVIEW_OUTPUT/report.json" .
          find "$REVIEW_OUTPUT" -maxdepth 1 -type f -name '*.jpg' -exec cp '{}' . \;
          git add -- '*.jpg' report.json
          git commit -m 'Capture rendered website and interaction evidence' || test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/codex/site-visual-review
