name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen
      - run: uv pip install --python .venv/bin/python -r requirements/testing.txt
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src .venv/bin/python -B -m coverage run --data-file "$RUNNER_TEMP/coverage.db" --source=clothdojo -m pytest tests -p no:cacheprovider --basetemp="$RUNNER_TEMP/pytest" --junitxml="$RUNNER_TEMP/junit.xml"
      - run: .venv/bin/python -B -m coverage json --data-file "$RUNNER_TEMP/coverage.db" -o "$RUNNER_TEMP/coverage.json"
      - run: uv run --frozen ruff check .
      - run: uv run --frozen python scripts/score_fold.py
      - run: uv build
