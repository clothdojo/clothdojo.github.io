# Single-GPU reference SFT; paths and step count are supplied by scripts/train.py.
clothdojo:
  action_chunk_boundary: full_only
cluster:
  num_nodes: 1
  component_placement:
    actor: '0'
  tracer:
    enable: false
runner:
  task_type: sft
  logger:
    log_path: outputs/training
    project_name: clothdojo
    experiment_name: pi05_sft
    logger_backends:
    - tensorboard
  max_epochs: -1
  max_steps: 1000
  val_check_interval: -1
  save_interval: 1000
  per_worker_log: false
  per_worker_log_path: null
data:
  train_data_paths: null
  openpi_data_home: null
  num_workers: 0
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 1
  seed: 43
  model:
    model_type: openpi_rlinf
    model_path: null
    precision: fp32
    pi05: true
    num_action_chunks: 50
    action_dim: 14
    is_lora: false
    lora_rank: 32
    use_proprio: true
    num_steps: 5
    add_value_head: false
    openpi:
      task: sft
      config_name: pi05_aloha_robotwin
      num_images_in_input: 3
      action_chunk: 50
      action_env_dim: 14
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      discrete_state_input: true
      max_token_len: 200
      use_rlt: false
    openpi_data:
      adapt_to_pi: false
      extra_delta_transform: true
      default_prompt: flatten the shirt
      norm_stats_path: null
  optim:
    lr: 5.0e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    total_training_steps: 1000
    lr_warmup_steps: 100
    lr_scheduler: openpi_cosine
    num_cycles: 0.5
    min_lr: 5.0e-06
    ema_decay: 0.99
  fsdp_config:
    strategy: fsdp
    wrap_policy:
      transformer_layer_cls_to_wrap:
      - Block
      - Encoder1DBlock
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    cpu_offload: true
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: false
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    save_full_model_weights: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
